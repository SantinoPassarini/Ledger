services:
  - type: web
    name: ledger-api
    runtime: docker
    plan: free
    # Region must match the Neon project region. Valid values:
    # oregon, ohio, virginia, frankfurt, singapore.
    # Defaults to oregon when omitted. The region cannot be changed after creation.
    # region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deployments are manual from the Render Dashboard after review.
    autoDeployTrigger: 'off'
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: Ledger.Api
      - key: Jwt__Audience
        value: Ledger.Desktop
      - key: Jwt__AccessTokenMinutes
        value: "480"
      # Temporary during onboarding; disable after the known users register.
      - key: Ledger__Registration__Enabled
        value: "true"
      # Secrets: Render prompts for these values when the Blueprint is created.
      # Real values must not be committed to this file.
      - key: ConnectionStrings__Ledger
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Ledger__Registration__InviteCode
        sync: false
      # Ledger__Owner and Ledger__Users must not be configured in production.
      # The accounts already exist in Neon and production provisioning must not modify them.
